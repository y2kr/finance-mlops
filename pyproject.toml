[project]
name = "finance-mlops"
version = "0.0.0"
description = "Self-hosted MLOps loop around a financial-news sentiment classifier"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
ingest = [
    "feedparser>=6",
    "psycopg[binary]>=3.2",
]
label = [
    "ollama>=0.5",
]
baseline = [
    "scikit-learn>=1.5",
    "mlflow>=3",
]
finetune = [
    "torch",
    "transformers>=4.46",
    "accelerate",
    "mlflow>=3",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "dvc[s3]>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_mlops"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
